
 <!--

    Página de demostración para probar la API de forma interactiva, a modo de interfaz de usuario mínima del prototipo.
    
    Aviso!!! Las opciones de los desplegables están escritas a mano, copiadas de esquema_categorias.json, en la contrucción de esta página. 
    Si el modelo se reentrena y las categorías cambian, hay que actualizar la página. Concretamente editar las opciones <option> de cada campo 
    a mano para que sigan coincidiendo con el esquema real que usa el modelo. Eso se debe a que es una manera simple para un prototipo de
    demostración rápido, una versión más robusta podría cargar estas opciones dinámicamente desde un endpoint tipo GET /schema en vez de tenerlas 
    fijas en el HTML.

-->

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Clínico · Osteosarcoma y Sarcoma de Ewing Pediátrico</title>
<style>
  :root {
    --ink: #16302b;
    --paper: #f6f4ee;
    --panel: #ffffff;
    --line: #d9dcd2;
    --moss: #3d6b58;
    --moss-dark: #2a4a3c;
    --clay: #b5652f;
    --muted: #6b7a72;
    --bubble-user: #e7e2d3;
    --bubble-bot: #eef3ef;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Iowan Old Style", "Georgia", serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  h1, h2, h3, label, button, .sans {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* ---------- Sidebar ---------- */
  aside {
    width: 340px;
    min-width: 300px;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 24px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  aside h1 {
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 4px;
    color: var(--moss-dark);
  }

  aside .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 28px;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 24px;
  }

  legend {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--moss-dark);
    margin-bottom: 10px;
    padding: 0;
  }

  .perfil-toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .perfil-toggle input { display: none; }

  .perfil-toggle label {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--muted);
    background: var(--panel);
    transition: background 0.15s, color 0.15s;
  }

  .perfil-toggle input:checked + label {
    background: var(--moss);
    color: #fff;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  select, input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    font-size: 0.85rem;
    font-family: inherit;
  }

  .patient-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--moss-dark);
    cursor: pointer;
    margin-bottom: 14px;
  }

  #patientFields { display: none; }
  #patientFields.open { display: block; }

  .status {
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 8px;
  }

  .status .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #b5652f;
    margin-right: 6px;
  }
  .status.ok .dot { background: var(--moss); }

  /* ---------- Chat ---------- */
  main {
    flex: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-log,
  form.composer {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 380px;
  }

  .empty-state h2 {
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 1.3rem;
    color: var(--moss-dark);
    font-weight: 600;
  }

  .bubble {
    max-width: 84%;
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 2px;
  }

  .bubble.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 2px;
  }

  .bubble.bot.loading { color: var(--muted); font-style: italic; }

  .pred-tag {
    display: inline-block;
    margin-top: 10px;
    font-family: -apple-system, sans-serif;
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--clay);
    color: #fff;
  }
  .pred-tag.low { background: var(--moss); }

  form.composer {
    display: flex;
    gap: 10px;
    padding: 18px 48px 28px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  .composer textarea {
    flex: 1;
    resize: none;
    height: 46px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--panel);
    color: var(--ink);
  }

  .composer button {
    padding: 0 22px;
    border: none;
    border-radius: var(--radius);
    background: var(--moss);
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .composer button:disabled { background: #a9b6ae; cursor: not-allowed; }

  .error-banner {
    background: #f4d9c7;
    color: #7a3a12;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: -apple-system, sans-serif;
    font-size: 0.82rem;
    margin: 0 48px 12px;
  }
</style>
</head>
<body>

<aside>
  <h1>Asistente Clínico</h1>
  <p class="subtitle">Osteosarcoma y sarcoma de Ewing pediátrico - Demo de la interfaz visual</p>

  <fieldset>
    <legend>¿Quién pregunta?</legend>
    <div class="perfil-toggle">
      <input type="radio" name="perfil" id="perfil-familia" value="familia" checked>
      <label for="perfil-familia">Familia</label>
      <input type="radio" name="perfil" id="perfil-oncologo" value="oncologo">
      <label for="perfil-oncologo">Oncólogo</label>
    </div>
  </fieldset>

  <label class="patient-toggle">
    <input type="checkbox" id="togglePatient">
    Incluir datos de un paciente concreto
  </label>

  <div id="patientFields">
    <div class="field"><label>Grupo de edad</label>
      <select id="age_group">
        <option>00 years</option><option>01-04 years</option><option>05-09 years</option>
        <option selected>10-14 years</option><option>15-19 years</option>
      </select>
    </div>
    <div class="field"><label>Sexo</label>
      <select id="sex"><option>Female</option><option>Male</option></select>
    </div>
    <div class="field"><label>Tipo de tumor</label>
      <select id="tumor_type">
        <option>Ewing sarcoma</option><option>Osteosarcoma NOS</option>
        <option>Osteosarcoma (other subtypes)</option>
      </select>
    </div>
    <div class="field"><label>Localización primaria</label>
      <select id="primary_site">
        <option>Lower limb bones</option><option>Upper limb bones</option>
        <option>Pelvis / hip</option><option>Vertebral column</option>
        <option>Skull / head / jaw</option><option>Trunk / ribs / sternum</option>
        <option>CNS / meninges</option><option>Other / NOS</option>
      </select>
    </div>
    <div class="field"><label>Estadio</label>
      <select id="stage">
        <option value="">No registrado</option>
        <option>Localized</option><option>Regional</option><option>Distant</option>
      </select>
    </div>
    <div class="field"><label>Cirugía</label>
      <select id="surgery_code">
        <option>Radical resection</option><option>Partial resection</option>
        <option>No surgery</option><option>Surgery NOS / Unknown</option>
      </select>
    </div>
    <div class="field"><label>Radioterapia</label>
      <select id="radiation">
        <option>No radiation</option><option>Radiation</option>
        <option>Recommended / Unknown</option><option>Refused</option>
      </select>
    </div>
    <div class="field"><label>Quimioterapia</label>
      <select id="chemotherapy"><option>Yes</option><option>No/Unknown</option></select>
    </div>
    <div class="field"><label>Año de diagnóstico</label>
      <input type="number" id="year_diagnosis" value="2024" min="1990" max="2030">
    </div>
  </div>

  <div class="status" id="apiStatus"><span class="dot"></span><span id="apiStatusText">Comprobando conexión con la API…</span></div>
</aside>

<main>
  <div class="chat-log" id="chatLog">
    <div class="empty-state" id="emptyState">
      <h2>¿En qué puedo ayudarte?</h2>
      <p>Elige el perfil en el panel izquierdo, añade opcionalmente los datos de un paciente, y escribe tu pregunta abajo.</p>
    </div>
  </div>

  <div id="errorBanner"></div>

  <form class="composer" id="composer">
    <textarea id="questionInput" placeholder="Escribe tu pregunta…" required></textarea>
    <button type="submit" id="sendBtn">Enviar</button>
  </form>
</main>

<script>
  const API_BASE = "http://localhost:8000";

  const chatLog = document.getElementById("chatLog");
  const emptyState = document.getElementById("emptyState");
  const composer = document.getElementById("composer");
  const questionInput = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const togglePatient = document.getElementById("togglePatient");
  const patientFields = document.getElementById("patientFields");
  const errorBanner = document.getElementById("errorBanner");
  const apiStatus = document.getElementById("apiStatus");
  const apiStatusText = document.getElementById("apiStatusText");

  togglePatient.addEventListener("change", () => {
    patientFields.classList.toggle("open", togglePatient.checked);
  });

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      if (!res.ok) throw new Error();
      apiStatus.classList.add("ok");
      apiStatusText.textContent = "API conectada";
    } catch {
      apiStatusText.textContent = "Sin conexión con la API (¿está arrancada?)";
    }
  }
  checkHealth();

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownLite(str) {
    // Soporte mínimo de Markdown: negrita (**texto**). Escapa el resto para evitar HTML
    // no deseado en la respuesta del modelo antes de insertarla en la página.
    const escaped = escapeHtml(str);
    return escaped.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  }

  function addBubble(text, who, { markdown = false } = {}) {
    emptyState.remove();
    const b = document.createElement("div");
    b.className = `bubble ${who}`;
    if (markdown) {
      b.innerHTML = renderMarkdownLite(text);
    } else {
      b.textContent = text;
    }
    chatLog.appendChild(b);
    chatLog.scrollTop = chatLog.scrollHeight;
    return b;
  }

  function buildPacienteOrNull() {
    if (!togglePatient.checked) return null;
    const stageVal = document.getElementById("stage").value;
    return {
      age_group: document.getElementById("age_group").value,
      sex: document.getElementById("sex").value,
      tumor_type: document.getElementById("tumor_type").value,
      primary_site: document.getElementById("primary_site").value,
      stage: stageVal === "" ? null : stageVal,
      surgery_code: document.getElementById("surgery_code").value,
      radiation: document.getElementById("radiation").value,
      chemotherapy: document.getElementById("chemotherapy").value,
      year_diagnosis: parseInt(document.getElementById("year_diagnosis").value, 10),
    };
  }

  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;

    errorBanner.innerHTML = "";
    addBubble(question, "user");
    questionInput.value = "";
    sendBtn.disabled = true;

    const loadingBubble = addBubble("Pensando…", "bot loading");

    const perfil = document.querySelector('input[name="perfil"]:checked').value;
    const body = { question, perfil, paciente: buildPacienteOrNull() };

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.detail ? JSON.stringify(errData.detail) : `Error ${res.status}`);
      }

      const data = await res.json();
      loadingBubble.remove();
      const botBubble = addBubble(data.answer, "bot", { markdown: true });

      if (data.prediccion) {
        const tag = document.createElement("span");
        tag.className = "pred-tag" + (data.prediccion.prediccion_riesgo_alto ? "" : " low");
        tag.textContent = `Riesgo ${data.prediccion.prediccion_riesgo_alto ? "alto" : "no alto"} · ${(data.prediccion.probabilidad_no_supervivencia_5a * 100).toFixed(1)}%`;
        botBubble.appendChild(document.createElement("br"));
        botBubble.appendChild(tag);
      }
    } catch (err) {
      loadingBubble.remove();
      errorBanner.innerHTML = `<div class="error-banner">No se pudo obtener respuesta: ${err.message}</div>`;
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>

</body>
</html>
